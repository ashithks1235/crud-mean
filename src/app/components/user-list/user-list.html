<div class="container mt-4">
  <h3>User List</h3>
  <a routerLink="/add-user" class="btn btn-success mb-2">Add User</a>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Age</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users()">
        <td>{{user.name}}</td>
        <td>{{user.email}}</td>
        <td>{{user.mobile}}</td>
        <td>{{user.age}}</td>
        <td>
          <a [routerLink]="['/edit-user', user._id]" class="btn btn-warning btn-sm">Edit</a>
          <button class="btn btn-danger btn-sm" (click)="deleteUser(user._id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
